# Тестовый порт
server.port=8080

# Тестовая БД (оставляем как было для Testcontainers)
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service_test
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (как было)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Kafka для тестов (может потребоваться EmbeddedKafka)
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Отключаем Eureka для тестов (ВАЖНО!)
eureka.client.enabled=false
spring.cloud.config.enabled=false

# Swagger отключаем в тестах
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Логирование для тестов
logging.level.org.klimtsov=DEBUG
logging.level.org.springframework.test=INFO