server:
  port: 8080

#Тестовая БД (Testcontainers).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/user_service_test
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    config:
      enabled: false

#Отключаем Eureka для тестов.
eureka:
  client:
    enabled: false

#Swagger отключаем в тестах.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

#Логирование для тестов.
logging:
  level:
    org.klimtsov: DEBUG
    org.springframework.test: INFO